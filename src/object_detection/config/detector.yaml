detector_node:
  ros__parameters:
    # Exported NCNN folder. ~ is your home folder. See the README.
    model_path: "~/models/yolo11n_ncnn_model"
    image_size: 320

    # Starting values, to tune on the robot in Phase 4. person is low on
    # purpose: a false alarm only asks for a password, a miss skips it.
    person_threshold: 0.25
    object_threshold: 0.5

    # A person only counts if their box reaches this far down the frame
    # (0 = top, 1 = bottom edge). On the floor, lower in the frame is closer.
    # On the robot at tilt 30 (10 Nov), a bottle at the stop distance ended at
    # 0.74 and people walking behind it at 0.46 to 0.61, so 0.65 keeps anyone
    # who could block the robot and ignores people further back. A person
    # walking up close reaches the bottom edge (0.99 in person_front).
    # 0 counts every person in frame (the old person first rule).
    person_min_bottom: 0.65

    # "yolo class=spoken label". Each label needs a found_<label> clip from
    # Lane 4 (audio_player).
    # No chair (11 Nov): at the stop distance the camera sees only the space
    # under a chair, so YOLO misses it, and a chair further back could be
    # named instead of what is in front. A chair plays found_obstacle.
    name_table:
      - "bottle=bottle"
      - "backpack=backpack"
      - "laptop=laptop"
      - "cup=cup"

    image_topic: "/camera/image_raw"   # real name confirmed at robot bring-up
    frame_timeout: 2.0                 # seconds to wait for a frame
