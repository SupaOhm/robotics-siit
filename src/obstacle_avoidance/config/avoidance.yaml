avoidance_node:
  ros__parameters:
    # scan:  LiDAR, sensor_msgs/LaserScan on scan_topic
    # range: ultrasonic, sensor_msgs/Range on range_topic
    input_type: "scan"
    scan_topic: "/scan"
    range_topic: "/ultrasonic/range"   # check the Yahboom name with `ros2 topic list`
    cmd_vel_topic: "/avoidance/cmd_vel"

    # LiDAR only
    front_angle_deg: 0.0        # 180.0 if the LiDAR is mounted facing backward
    corridor_half_width: 0.20   # front looks along a corridor this far either side
                                # of the centre line (m): half the robot width + margin
    side_half_width_deg: 30.0   # left / right sectors are +-30 deg around +-90 deg

    filter_window: 5            # median of the last 5 readings
    min_range: 0.02             # closer than this = glitch, dropped (m)
    max_range: 4.0              # farther / inf = nothing near (m)

    stop_distance: 0.30         # blocked at or below this (m)
    clear_distance: 0.40        # clear again at or above this (m)
    sensor_timeout: 0.5         # no reading this long -> blocked, turn fails (s)

    # How AVOID turns away (D6, D13). The state machine cancels AVOID after
    # 10 s with no result, so keep a full turn well under that.
    drive_type: "ackermann"     # ackermann: the A1, can't turn in place (backs up, then arcs)
                                # diff: turns in place
    imu_topic: "/imu/data_raw"  # gyro for the turned angle; "" = estimate it from the commands

    # ackermann only
    avoid_speed: 0.15           # m/s while backing and arcing
    wheelbase: 0.16             # m, front to rear axle: measure on the A1
    max_steer_deg: 30.0         # full lock: measure on the A1
    back_turn_deg: 30.0         # each backing phase stops after this much turn,
    max_reverse: 0.25           # or after this far back (m),
    rear_clear: 0.20            # or when something is this close behind (m, LiDAR only)
    arc_min_front: 0.20         # back up again if the front closes to this while arcing (m)
    max_cycles: 3               # backing phases before "failed"

    # diff only
    turn_speed: 1.0             # rad/s while turning in place

    min_turn_deg: 30.0
    max_turn_deg: 270.0         # turned this far with no clear front -> "failed"
    clear_time: 0.3             # front must stay clear this long (s)
    default_direction: 1        # 1 = left, -1 = right (ultrasonic, or a tie)
    control_rate: 20.0          # Hz
    detected_rate: 10.0         # Hz, /obstacle/detected heartbeat (contract D5)
