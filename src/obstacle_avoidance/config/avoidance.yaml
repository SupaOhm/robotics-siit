avoidance_node:
  ros__parameters:
    # scan:  LiDAR, sensor_msgs/LaserScan on scan_topic
    # range: ultrasonic, sensor_msgs/Range on range_topic
    input_type: "scan"
    scan_topic: "/scan"
    range_topic: "/ultrasonic/range"   # check the Yahboom name with `ros2 topic list`
    cmd_vel_topic: "/avoidance/cmd_vel"

    # LiDAR only
    front_angle_deg: 180.0      # the M1's LiDAR 0 deg points backward (wall test, 2026-11-05)
    corridor_half_width: 0.20   # front looks along a corridor this far either side
                                # of the centre line (m): half the robot width + margin
    side_half_width_deg: 30.0   # left / right sectors are +-30 deg around +-90 deg

    filter_window: 5            # median of the last 5 readings
    min_range: 0.02             # closer than this = glitch, dropped (m)
    max_range: 4.0              # farther / inf = nothing near (m)

    sensor_to_bumper: 0.15      # m from the LiDAR to the front bumper (M1, taped 6 Nov).
                                # stop, clear and /obstacle/distance are from the bumper
    stop_distance: 0.40         # blocked at or below this (m from the bumper)
    clear_distance: 0.50        # clear again at or above this (m from the bumper)
    sensor_timeout: 0.5         # no reading this long -> blocked, turn fails (s)

    # How AVOID turns away (D6, D13). The M1 has mecanum wheels, so it turns
    # in place. The state machine cancels AVOID after 10 s with no result, so
    # keep max_turn_deg / turn_speed (in rad) + clear_time well under 10 s.
    imu_topic: "/imu/data_raw"  # gyro for the turned angle; "" = estimate it as speed x time
    imu_timeout: 0.3            # no gyro reading this long -> speed x time until it's back (s)
    turn_speed: 1.0             # rad/s while turning in place
    min_turn_deg: 30.0
    max_turn_deg: 270.0         # turned this far with no clear front -> "failed"
    clear_time: 0.3             # front must stay clear this long (s)
    default_direction: 1        # 1 = left, -1 = right (ultrasonic, or a tie)
    control_rate: 20.0          # Hz
    detected_rate: 10.0         # Hz, /obstacle/detected heartbeat (contract D5)
