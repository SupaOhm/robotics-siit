telegram_node:
  ros__parameters:
    # The bot token and chat id are NOT stored here. Set TELEGRAM_BOT_TOKEN
    # and TELEGRAM_CHAT_ID in the environment, or pass the gitignored .env:
    #   ros2 launch telegram_alert telegram.launch.py env_file:=$HOME/robotics-siit/.env
    image_topic: "/camera/image_raw"   # real name confirmed at robot bring-up; set it here
    jpeg_quality: 85
    max_image_age: 2.0                 # seconds; older frames get a note in the caption
    operator_timeout: 40               # match the state machine's WAIT_OPERATOR timeout
    photo_delay: 10.5                  # seconds from /telegram/alert to the photo: password_denied
                                       # (3.3 s) + photo_countdown (6.1 s) + a margin
    retake_delay: 7.0                  # seconds from a Retake press to the photo: photo_countdown
                                       # (6.1 s) + a margin
    recording_dir: "/tmp/password_attempts"  # must match password_node: recordings outside it are ignored
