password_node:
  ros__parameters:
    # The password is NOT stored here (contract: kept out of the repo).
    # Run `ros2 run password_system make_password_hash <digits>` and export
    # the ROBOT_PASSWORD_* lines it prints on the robot.

    max_attempts: 3
    match_mode: "contains"   # contains: extra words around the digits are OK
                             # exact:    only the digits may be said
    max_service_errors: 3    # mic / engine failures in a row -> "denied" (operator decides)

    # mic: robot USB microphone.  sim: typed attempts on /password/sim_input (D27)
    input_mode: "mic"
    engine: "vosk"           # vosk (offline, digits only, D24) | google (online fallback)
    language: "en-US"
    mic_device_index: -1     # -1 = default; list devices in the README
    vosk_model_path: ""      # empty = download the small model for `language`

    listen_delay: 2.5        # wait after a prompt clip before listening (s)
    listen_timeout: 6.0      # silence this long -> counts as a failed attempt (s)
    phrase_time_limit: 5.0   # max length of one answer (s)
