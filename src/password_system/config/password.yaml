password_node:
  ros__parameters:
    # The password is NOT stored here (contract: kept out of the repo).
    # Run `ros2 run password_system make_password_hash <digits>` and export
    # the ROBOT_PASSWORD_HASH line it prints on the robot.
    #
    # input_mode (mic | sim), engine (vosk | google) and vosk_model_path (the
    # unzipped model folder, required for mic + vosk) are launch arguments:
    #   ros2 launch password_system password.launch.py vosk_model_path:=$HOME/vosk-model-small-en-us-0.15
    #   ros2 launch password_system password.launch.py input_mode:=sim

    max_attempts: 3
    match_mode: "exact"      # exact:    the digits heard must be the password
                             # contains: the password anywhere in a longer run of
                             #           digits (lets one attempt test many codes)
    max_service_errors: 3    # mic / engine failures in a row -> "denied" (operator decides)

    language: "en-US"
    mic_device_index: -1     # -1 = default; list devices in the README

    listen_delay: 2.5        # wait after a prompt clip before listening (s)
    listen_timeout: 6.0      # silence this long -> counts as a failed attempt (s)
    phrase_time_limit: 5.0   # max length of one answer (s)
    operation_timeout: 10.0  # google engine: give up on a slow request (s)
    sim_timeout: 8.5         # sim: no typed attempt this long -> silence (s); 0 = off
