password_node:
  ros__parameters:
    # Demo password is "one three five two" (also matches "1352").
    # Change it with:  ros2 run password_system make_password_hash <words>
    password_chars: 4
    salt: "07686955b6ad1c1d"
    password_hash: "d158fd55338751a7c4084ad5503119b9af09f553eb6b02c86484b581267314ec"

    max_attempts: 3
    match_mode: "contains"   # contains: extra words around the password are OK
                             # exact:    the whole phrase must be the password
    max_service_errors: 3    # speech engine failures in a row -> "denied" (operator decides)

    # mic:        listen on the robot microphone
    # topic_only: read attempts as text from /password/text (simulation / testing)
    input_mode: "mic"
    engine: "google"         # google (online) | vosk (offline)
    language: "en-US"        # e.g. th-TH for Thai with google
    mic_device_index: -1     # -1 = default; list devices in the README
    vosk_model_path: ""      # empty = download the small model for `language`

    listen_delay: 2.5        # wait after the prompt clip before listening (s)
    listen_timeout: 6.0      # silence this long -> counts as a failed attempt (s)
    phrase_time_limit: 5.0   # max length of one answer (s)
    log_transcripts: false   # true only while tuning: logs what was heard
