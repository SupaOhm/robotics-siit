password_node:
  ros__parameters:
    # Demo password is 1-3-5-2 (fingers raised). Change it with:
    #   ros2 run password_system make_password_hash <digits>
    password_length: 4
    salt: "07686955b6ad1c1d"
    password_hash: "d158fd55338751a7c4084ad5503119b9af09f553eb6b02c86484b581267314ec"

    max_attempts: 3
    input_timeout: 15.0     # seconds without input -> counts as a wrong attempt

    hold_time: 0.8          # seconds a finger count must be held to register
    release_time: 0.4       # fist / no hand this long to repeat the same digit

    # camera:        run MediaPipe here on image_topic (only during a session)
    # fingers_topic: use raw finger counts published by another node (Int32, -1 = no hand)
    # topic_only:    only /password/token (simulation / testing)
    input_mode: "camera"
    image_topic: "/camera/image_raw"
    fingers_topic: "/gesture/fingers"
    process_every_n_frames: 1
    min_detection_confidence: 0.6
