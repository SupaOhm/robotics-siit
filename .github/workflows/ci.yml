name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-22.04   # same OS as ROS 2 Humble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # python-telegram-bot: so telegram_alert's test_bot.py runs (no network needed)
      - run: pip install pytest "python-telegram-bot==22.8"
      - name: Run tests in every package that has a test/ folder
        run: |
          status=0
          for t in src/*/test; do
            [ -d "$t" ] || continue
            pkg=$(dirname "$t")
            echo "::group::$pkg"
            (cd "$pkg" && python -m pytest test) || status=1
            echo "::endgroup::"
          done
          exit $status
